<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KILL ME!</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script nomodule src="https://unpkg.com/@google/model-viewer/dist/model-viewer-legacy.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&display=swap" rel="stylesheet"> <!-- Adding the Space Grotesk font -->
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      width: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 20;
     
      font-family: 'Space Grotesk', sans-serif; /* Applying the custom font */    
      overflow: hidden; /* Prevent content overflow */
     
    }
    .imgbox {
      position: relative;
      height: 100%;
      width: 100%;
    }
    .centered-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: space-between;
      width: 100%; /* Adjust as needed */
      font-size: 2em; /* Setting the text size */
      font-weight: 500; /* Setting the font weight */
      z-index: 1;  /* Ensure text is above the model viewer */
    }
    .centered-text span {
      white-space: nowrap;
    }
    model-viewer {
      height: 100%;
      width: 100%;
      z-index: 2;
    }
     #ar-button {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 10%;
    z-index: 3; /* Ensure the button is above other elements */
    font-family: 'Space Grotesk', sans-serif; /* Apply the custom font */
    font-size: 1em; /* Set the font size */
    background-color: rgba(0, 0, 0, 0.3); /* 30% transparent grey background */
    backdrop-filter: blur(10px); /* Blur effect */
    -webkit-backdrop-filter: blur(10px); /* Blur effect for WebKit browsers */
    border: none; /* Remove default border */
    padding: 24px 38px 24px 36px; /* Top, Right, Bottom, Left padding */
    color: white; /* Set text color */
    border-radius: 20px; /* Optional: rounded corners */
  }
    #ar-button:active {
      background-color: #E8EAED;
    }

    #ar-button:focus {
      outline: none;
    }

    #ar-button:focus-visible {
      outline: 1px solid #4285f4;
    }

  .gradient-blur-root, .gradient-blur-root * { box-sizing: border-box; }

  .gradient-blur-root {
    position: relative;
    height: 100%;
    width: 100%;
    pointer-events: none;
    overflow: visible;
  }

  /* overlay blending on each layer */
  .gradient-blur-root .layer { position: absolute; inset: 0 }

  /* steps (custom properties) */
  .gradient-blur-root .layer[data-step="1"]  { --top: 0%;  --bottom: 20%;  --blur: 0px; }
  .gradient-blur-root .layer[data-step="2"]  { --top: 10%; --bottom: 30%;  --blur: 2px; }
  .gradient-blur-root .layer[data-step="3"]  { --top: 20%; --bottom: 40%;  --blur: 4px; }
  .gradient-blur-root .layer[data-step="4"]  { --top: 30%; --bottom: 50%;  --blur: 6px; }
  .gradient-blur-root .layer[data-step="5"]  { --top: 40%; --bottom: 60%;  --blur: 8px; }
  .gradient-blur-root .layer[data-step="6"]  { --top: 50%; --bottom: 70%;  --blur: 10px; }
  .gradient-blur-root .layer[data-step="7"]  { --top: 60%; --bottom: 80%;  --blur: 20px; }
  .gradient-blur-root .layer[data-step="8"]  { --top: 70%; --bottom: 90%;  --blur: 30px; }
  .gradient-blur-root .layer[data-step="9"]  { --top: 80%; --bottom: 100%; --blur: 40px; }
  .gradient-blur-root .layer[data-step="10"] { --top: 90%; --bottom: 100%; --blur: 50px; }

  /* WebKit-compatible blur and masks */
  .gradient-blur-root .layer {
    /* blur */
    backdrop-filter: blur(var(--blur));               /* standard */             /* MDN */ 
    -webkit-backdrop-filter: blur(var(--blur));       /* WebKit */               /* MDN */
    /* mask */
    mask-image: linear-gradient(
      to bottom,
      rgba(0,0,0,0) var(--top),
      rgba(0,0,0,1) var(--bottom)
    );                                               /* standard */              /* LogRocket */
    -webkit-mask-image: linear-gradient(
      to bottom,
      rgba(0,0,0,0) var(--top),
      rgba(0,0,0,1) var(--bottom)
    );                                               /* WebKit */                /* LogRocket */
  }


  </style>
</head>
<body>
  <div class="imgbox">
    <model-viewer 
      
      src="https://error420notfound.github.io/anoka/Murti%201.1%20.glb" 
      ar-scale="fixed"
      ar-modes="scene-viewer webxr quick-look" 
      ar 
      ios-src="https://error420notfound.github.io/anoka/Murti%201.1%20.usdz?raw=true" 
      xr-environment
      alt="A 3D model"
      interaction-prompt="none"  
      camera-controls 
      auto-rotate 
      disable-pan 
      disable-zoom
      disable-tap 
      shadow-intensity="1"
      camera-orbit="90deg 95deg 4m" 
      reveal="auto" 
      loading="eager"
      id="orbit-demo"
      generate-schema>
      <button slot="ar-button" id="ar-button">
    View in your space
  </button>
    </model-viewer>
    <div class="centered-text">
      <span style="text-align: left; padding-left: 30px;
      padding-right: 30px;">Product</span>
      <span style="text-align: right; padding-left: 30px;
      padding-right: 30px;">Design</span>
    </div>
    <div class="gradient-blur-root" aria-hidden="true">
  <div class="layer" data-step="1"  style="z-index:1"></div>
  <div class="layer" data-step="2"  style="z-index:2"></div>
  <div class="layer" data-step="3"  style="z-index:3"></div>
  <div class="layer" data-step="4"  style="z-index:4"></div>
  <div class="layer" data-step="5"  style="z-index:5"></div>
  <div class="layer" data-step="6"  style="z-index:6"></div>
  <div class="layer" data-step="7"  style="z-index:7"></div>
  <div class="layer" data-step="8"  style="z-index:8"></div>
  <div class="layer" data-step="9"  style="z-index:9"></div>
  <div class="layer" data-step="10" style="z-index:10"></div>
</div>

  </div>
</body>
</html>
