<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <title>Life Receipt</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=contrast" />

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="https://error420notfound.github.io/anoka/Icon-Light-167x167@2x.svg">
<link rel="alternate icon" href="https://error420notfound.github.io/anoka/Icon-Light-167x167@2x.png">

<!-- Apple Touch Icon (iOS Home Screen) -->
<link rel="apple-touch-icon" href="https://error420notfound.github.io/anoka/Icon-Light-167x167@2x.png" sizes="167x167">

<!-- For older browsers -->
<link rel="shortcut icon" href="https://error420notfound.github.io/anoka/Icon-Light-167x167@2x.png">

<link rel="manifest" href="https://error420notfound.github.io/anoka/first.json">
<meta name="theme-color" content="#000000">



  <style>
    :root {
      --font-body: "Rajdhani", sans-serif;
      --font-heading: "Instrument Serif", serif;
      --radius: 1rem;

      /* light mode defaults */
      --bg: rgb(229,229,234);
      --text: rgb(28,28,30);
      --card-bg: rgba(238,238,238,0.4);
      --card-border: #eee;
      --overlay-bg: rgba(238,238,238,0.5);
      --overlay-blend: lighten;
      --button-bg: #111;
      --button-text: #fff;
    }

    body.dark {
      --bg: rgb(28,28,30);
      --text: rgb(229,229,234);
      --card-bg: rgba(44,44,46,0.4);
      --card-border: #333;
      --overlay-bg: rgba(0,0,0,0.5);
      --overlay-blend: darken;
      --button-bg: #eee;
      --button-text: #000;
    }

    html { font-size: 12px; }
    @media (min-width: 500px) { html { font-size: 14px; } }
    @media (min-width: 810px) { html { font-size: 16px; } }
    @media (min-width: 1024px) { html { font-size: 18px; } }
    @media (min-width: 2560px) { html { font-size: 20px; } }

    body {
      font-family: var(--font-body);
      font-weight: 500;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    /* Heading */
    h1 {
      font-family: var(--font-heading);
      font-weight: 600;
      margin: 0;
      text-align: center;
      letter-spacing: 0.03em;
      font-size: clamp(2rem, 4vw, 3.5rem);
    }
    @media (max-width: 400px) {
      h1 { letter-spacing: 0.01em; }
    }

    /* Background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('https://raw.githubusercontent.com/error420notfound/anoka/refs/heads/main/uiFMF1Pd0tF3pWL2HvL99T3eVM.png') center/cover no-repeat;
      z-index: -2;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      mix-blend-mode: var(--overlay-blend);
      transition: background 0.6s ease 0.1s, mix-blend-mode 0.6s ease;
      z-index: -1;
    }

    /* Layout defaults (mobile) */
    .left-col, .right-col {
      width: 100%;
      max-width: 600px;
      margin: 1rem auto;
      text-align: center;
    }
    body {
      justify-content: center;
      align-items: center;
    }
        main {
            display: flex;
            width: 100%;
            padding: 12px;
        }
    /* Tablet: form sticky bottom */
    @media (min-width: 500px) and (max-width: 1023px) {
      body {
        justify-content: flex-start;
        align-items: stretch;
      }
      .left-col {
        margin-top: 2rem;
      }
      .right-col {
        margin-top: auto;
        margin-bottom: 20px;
      }
      form {
        position: sticky;
        bottom: 20px;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
      }
    }

    /* Desktop split */
    @media (min-width: 1024px) {
      body {
        flex-direction: row;
        align-items: stretch;
        height: 100svh;
      }
      .left-col {
        flex: 1;
        max-width: 50vw;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 2rem;
        text-align: left;
      }
      .h1-wrapper { flex: 1; display: flex; align-items: center; }
      .left-col footer { margin-top: auto; text-align: left; }
      .right-col {
        flex: 1;
        max-width: 50vw;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      form {
        width: 100%;
        position: static;
        margin-left: 2rem;
      }
      h1 { text-align: left; }
    }

    /* Form */
    form {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      font-size: 1rem;
      font-weight: 500;
      backdrop-filter: blur(3rem);
      -webkit-backdrop-filter: blur(3rem);
    }
    textarea {
      width: 100%;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 1rem;
      resize: none;
      font-size: 1.2rem;
      font-family: inherit;
      font-weight: inherit;
      color: inherit;
      box-sizing: border-box;
      background: var(--card-bg);
      margin-bottom: 1rem;
    }
    textarea:focus {
      outline: none;
      border-color: #555;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.15);
    }
    #char-counter { text-align: right; font-size: 0.85rem; margin-top: 0.5rem; opacity: 0.7; }
    #char-counter.warning { color: red; }
    button {
      width: 100%;
      background: var(--button-bg);
      color: var(--button-text);
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      margin-top: 1rem;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease;
      font-family: inherit;
    }
    button:hover {
      background: #333;
      color: #fff;
      transform: scale(1.02);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* Thank you */
    #thank-you {
      display: none;
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 0;
      text-align: center;
      animation: fade-in 0.6s ease-out forwards;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      backdrop-filter: blur(3rem);
      -webkit-backdrop-filter: blur(3rem);
    }
    #thank-you p { margin-bottom: 1.5rem; }
    #new-receipt {
      background: var(--button-bg);
      color: var(--button-text);
      padding: 0.9rem 1.2rem;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #new-receipt:hover {
      background: #333;
      color: #fff;
      transform: scale(1.02);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    footer { font-size: 0.85rem; opacity: 0.7; }
    footer a { color: inherit; text-decoration: underline; }
    footer a:hover { color: #d33; }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px);}
      to { opacity: 1; transform: translateY(0);}
    }

    /* Theme toggle */
    .menu {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      background: rgba(229,229,234,0.5);
      backdrop-filter: blur(10px);
      transition: background 0.4s ease, color 0.2s ease;
    }
    .theme-toggle {
      border: none;
      cursor: pointer;
      border-radius: 50%;
      height: 40px;
      width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.4s ease, color 0.2s ease;
    }
    body.light .theme-toggle { background: #eee; color: #111; }
    body.dark .theme-toggle { background: #222; color: #eee; }
    .theme-toggle:hover { background: rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <!-- Left column -->
  <div class="left-col">
    <div class="h1-wrapper">
      <h1>Life Receipt:</h1>
    </div>
    <footer>
      Designed with love by 
      <a href="https://error420notfound.github.io/anoka/webar.html" target="_blank">HS108</a>
    </footer>
  </div>

  <!-- Right column -->
  <div class="right-col">
    <main>
      <form id="receipt-form" onsubmit="handleSubmit(event)" action="/submit" method="post">
        <textarea
          name="message"
          maxlength="200"
          oninput="handleInput(this)"
          onkeypress="handleKeyPress(event)"
          placeholder="Type your receipt…"
          rows="6"
          required></textarea>
        <div id="char-counter">200 characters left</div>
        <button type="submit">Send</button>
      </form>

      <div id="thank-you">
        <p>🎉 Receipt sent</p>
        <button id="new-receipt">Print another receipt</button>
      </div>
    </main>
  </div>

  <!-- Theme Toggle Menu -->
  <div class="menu">
    <button class="theme-toggle" id="themeToggle">
      <span class="material-symbols-outlined">contrast</span>
    </button>
  </div>

<script>
  function handleInput(el) {
    const counter = document.getElementById('char-counter');
    const remaining = 200 - el.value.length;
    counter.textContent = remaining + " characters left";
    counter.classList.toggle('warning', remaining <= 20);
  }
  function handleSubmit(e) {
    e.preventDefault();
    const form = document.getElementById('receipt-form');
    const message = document.getElementById('thank-you');
    form.style.display = "none";
    message.style.display = "block";
    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }});
    document.getElementById('new-receipt').addEventListener('click', () => { location.reload(); });
  }
  function handleKeyPress(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('receipt-form').dispatchEvent(new Event('submit'));
    }
  }
  const themeToggle = document.getElementById("themeToggle");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  if (!localStorage.getItem("theme")) {
    document.body.classList.add(prefersDark ? "dark" : "light");
  } else {
    document.body.classList.add(localStorage.getItem("theme"));
  }
  themeToggle.addEventListener("click", () => {
    if (document.body.classList.contains("light")) {
      document.body.classList.replace("light", "dark");
      localStorage.setItem("theme", "dark");
    } else {
      document.body.classList.replace("dark", "light");
      localStorage.setItem("theme", "light");
    }
  });
</script>
</body>
</html>
