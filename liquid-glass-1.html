

<html>
    <head>
        <style>
        /* LIQUID GLASS STYLES */



.liquidGlass-wrapper {
  position: relative;
  display: flex;
  font-weight: 600;
  overflow: hidden;
  box-shadow: 0 6px 6px rgba(0, 0, 0, 0.24), 0 0 20px rgba(0, 0, 0, 0.199);

  transition: all 0.4s cubic-bezier(-200, 200, -200, 20); 
}

.liquidGlass-effect {
  position: absolute;
  z-index: 0;
  inset: 0;
backdrop-filter: contrast(120%) blur(5px) brightness(105%);
/*  backdrop-filter: blur(5px); */
  filter: url(#glass-distortion);
 
  overflow: hidden;
}

.liquidGlass-tint {
  isolation: isolate;
  mix-blend-mode: Lighten;
  z-index: 1;
  position: absolute;
  inset: 0;
  
  background: rgba(255, 255, 255, 0.26);
  
}

.liquidGlass-shine {
  isolation: isolate;
  position: absolute;
  inset: 0;
  z-index: 2;

  overflow: hidden;
  mix-blend-mode: Color-Dodge;

  box-shadow: inset 2px 2px 1px 0 rgba(255, 255, 255, 0.5),
    inset -1px -1px 1px 1px rgba(255, 255, 255, 0.5);
}

.liquidGlass-text {
  z-index: 3;
  font-size: 2rem;
  color: black;
}

/* OTHER STYLES */

body {
  padding: 0;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100svh;
  background: url("https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/beautiful-orange-and-pastel-flowers-seamless-pattern-julien.jpg")
    center center;
  background-size: 500px;
  font-family: sans-serif;
  font-weight: 300;

  animation: moveBackground 240s ease-out 0s infinite; 
  transition:  0.6s ease ;
  transition-property: all;
  transition-delay: 160ms;
 
}

/*
GREEN BACKGROUND
https://media.istockphoto.com/id/1430511443/vector/christmas-mistletoe-foliage-and-berries-vector-seamless-pattern.jpg?s=612x612&w=0&k=20&c=oqxlH7ytgd5yjBQroACirJ1gH7Au1tq8gmsdeGd-Crk=

ORANGE BACKGROUND
https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/beautiful-orange-and-pastel-flowers-seamless-pattern-julien.jpg

MARGARITAS BACKGROUND
https://static.vecteezy.com/system/resources/previews/056/652/082/non_2x/hand-drawn-white-flower-seamless-pattern-floral-repeating-wallpaper-for-textile-design-fabric-print-wrapping-paper-cute-daisy-flowers-on-blue-background-repeated-ditsy-texture-vector.jpg

SPRING FLOWERS BACKGROUND
https://img.freepik.com/free-vector/flat-floral-spring-pattern-design_23-2150117078.jpg

VECTOR WINDS BACKGROUND
https://i.ibb.co/MDbLn4N4/vectors.png

RED FLOWERS BACKGROUND
https://www.publicdomainpictures.net/pictures/610000/velka/seamless-floral-wallpaper-art-1715193626Gct.jpg
*/

a {
  text-decoration: none;
}

.wrapper {
  display: flex;
  gap: 25px;
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
}


.dock {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 2rem;
  padding: 1.2rem;
}

/* NOTE: You need to duplicate styles onto the child `div`s (`> div`) so that the glass wrapper and all the layers are affected in the same way.  */
.dock,
.dock > div {
  border-radius: 2rem;
}

/* .dock:hover {
  padding: 2rem;
  border-radius: 2.5rem;

} */
.dock:hover > div {
  border-radius: 2.5rem;
  padding: 2rem;
   transition: all 0.4s cubic-bezier(0.175, 1, 0.5, 2.2);
}

.dock img {
  width: 75px;
  padding: 0;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 2.2);
  cursor: pointer;
}

.dock img:hover {
  transform: scale(0.95);
  transform-origin: center center;
}

@keyframes moveBackground {
  from {
    background-position: 0% 0%;
  }
  to {
    background-position: 0% -1500%;
  }
}
</style>
    </head>
    <body>
         <div class="wrapper">
        <div class="liquidGlass-wrapper dock">
          <div class="liquidGlass-effect"></div>
          <div class="liquidGlass-tint"></div>
          <div class="liquidGlass-shine"></div>
          <div class="liquidGlass-text">
            <div class="dock">
              <img
                src="https://raw.githubusercontent.com/lucasromerodb/liquid-glass-effect-macos/refs/heads/main/assets/finder.png"
                alt="Finder"
              />
              <img
                src="https://raw.githubusercontent.com/lucasromerodb/liquid-glass-effect-macos/refs/heads/main/assets/map.png"
                alt="Finder"
              />
              <img
                src="https://raw.githubusercontent.com/lucasromerodb/liquid-glass-effect-macos/refs/heads/main/assets/messages.png"
                alt="Finder"
              />
              <img
                src="https://raw.githubusercontent.com/lucasromerodb/liquid-glass-effect-macos/refs/heads/main/assets/notes.png"
                alt="Finder"
              />
              <img
                src="https://raw.githubusercontent.com/lucasromerodb/liquid-glass-effect-macos/refs/heads/main/assets/safari.png"
                alt="Finder"
              />
              <img
                src="https://raw.githubusercontent.com/lucasromerodb/liquid-glass-effect-macos/refs/heads/main/assets/books.png"
                alt="Finder"
              />
            </div>
          </div>
        </div>

    <svg style="display: none">
      <filter
        id="glass-distortion"
        x="0%"
        y="0%"
        width="100%"
        height="100%"
        filterUnits="objectBoundingBox"
      >
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.01 0.01"
          numOctaves="1"
          seed="5"
          result="turbulence"
        />
        <!-- Seeds: 14, 17,  -->

        <feComponentTransfer in="turbulence" result="mapped">
          <feFuncR type="gamma" amplitude="30" exponent="100" offset="10" />
          <feFuncG type="gamma" amplitude="500" exponent="100" offset="-100" />
          <feFuncB type="gamma" amplitude="30" exponent="10" offset="10" />
        </feComponentTransfer>

        <feGaussianBlur in="turbulence" stdDeviation="10" result="softMap" />

        <feSpecularLighting
          in="softMap"
          surfaceScale="500"
          specularConstant="120"
          specularExponent="10000"
          lighting-color="white"
          result="specLight"
        >
          <fePointLight x="-2000" y="-2000" z="300" />
        </feSpecularLighting>

        <feComposite
          in="specLight"
          operator="arithmetic"
          k1="0.15"
          k2="0.75"
          k3="0.95"
          k4="0.25"
          result="litImage"
        />

        <feDisplacementMap
          in="SourceGraphic"
          in2="softMap"
          scale="300"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    </body>
</html>
